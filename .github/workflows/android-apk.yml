# Membangun APK Android (debug) untuk Panel Admin Sadalan dengan pelacakan GPS latar belakang sungguhan.
# Jalankan manual: tab Actions → "Bangun APK Android" → Run workflow. Hasil: artifact "sadalan-debug-apk".
name: Bangun APK Android
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Alamat situs (tanpa /admin). Kosongkan untuk https://<pemilik>.github.io/<repositori>'
        required: false
        default: ''
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Siapkan proyek Android
        working-directory: native
        env:
          INPUT_URL: ${{ github.event.inputs.site_url }}
        run: |
          npm install
          SITE_URL="${INPUT_URL%/}"
          if [ -z "$SITE_URL" ]; then SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"; fi
          echo "Alamat situs: $SITE_URL"
          sed "s|__SITE_URL__|$SITE_URL|g" capacitor.config.template.json > capacitor.config.json
          npx cap add android
          node patch-manifest.js
          npx cap sync android
      - name: Bangun APK
        working-directory: native/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: sadalan-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
